<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 按需任务入口</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18232e;font:15px/1.55 system-ui,'Microsoft YaHei',sans-serif}main{max-width:900px;margin:7vh auto;padding:0 24px}header{display:flex;align-items:center;gap:12px}header strong{font-size:26px}small,.hint{color:#637383}section{background:white;border:1px solid #dce2e8;border-radius:14px;padding:24px;margin:22px 0;box-shadow:0 5px 25px #19304708}label{display:block;font-weight:600;margin:12px 0 6px}textarea,input{width:100%;padding:12px;border:1px solid #c7d1db;border-radius:8px;font:inherit;background:#fcfdff}textarea{min-height:130px;resize:vertical}button{border:0;border-radius:8px;padding:10px 17px;background:#155ac0;color:white;font:inherit;cursor:pointer}button.secondary{background:#e8edf3;color:#30475e}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:12px;align-items:center;margin-top:18px}.pill{display:inline-block;border-radius:20px;background:#eaf2fb;padding:3px 10px;font-size:12px;margin:3px}.task{padding:15px 0;border-bottom:1px solid #edf0f4}.task:last-child{border:0}.task p{margin:5px 0}.error{color:#a32626}#workspace{position:fixed;inset:0;background:white;display:none;z-index:10}#workspacebar{height:44px;padding:5px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #dde3eb}#workspacebar button{padding:4px 12px;font-size:13px}iframe{display:block;width:100%;height:calc(100vh - 44px);border:0}#notice{min-height:24px;white-space:pre-wrap}code{font-size:12px}a{color:#155ac0}
</style></head><body><main><header><strong>DSH 按需任务</strong><span class="pill">模型选插件 · 独立进程</span></header><p class="hint">先描述任务。模型确定插件范围，独立会话就绪后再开始处理。</p><section><form id="form"><label for="prompt">这次要完成什么？</label><textarea id="prompt" required placeholder="例如：读取项目文件，分析启动性能并生成一份报告。"></textarea><label for="cwd">工作目录</label><input id="cwd" required placeholder="E:\project\my-project"><div class="actions"><button id="start">选择插件并开始</button><small id="model"></small></div></form><p id="notice" role="status"></p></section><section><strong>任务运行时</strong><div id="tasks"><p class="hint">尚无任务。</p></div></section><details><summary>模型可选择的已安装能力</summary><div id="catalog"></div></details></main><div id="workspace"><div id="workspacebar"><button id="back" class="secondary">返回任务入口</button><span id="worker-state"></span><button id="stop-active" class="secondary">停止此任务</button></div><iframe id="worker" title="DSH 独立任务会话" referrerpolicy="no-referrer"></iframe></div><script src="/router-browser.js"></script></body></html>
